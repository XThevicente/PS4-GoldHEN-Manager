name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ps4_manager.py'
      - 'requirements.txt'
      - 'assets/**'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Validate source
        run: python -m py_compile ps4_manager.py

      - name: Build EXE
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name PS4_GoldHEN_Manager_v1.0.0
          --icon assets/ps4_goldhen_manager.ico
          --add-data "assets/ps4_goldhen_manager.ico;assets"
          ps4_manager.py

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS4_GoldHEN_Manager_v1.0.0_Windows
          path: dist/PS4_GoldHEN_Manager_v1.0.0.exe

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.0.0 "dist/PS4_GoldHEN_Manager_v1.0.0.exe" --clobber
          } else {
            gh release create v1.0.0 "dist/PS4_GoldHEN_Manager_v1.0.0.exe" --title "PS4 GoldHEN Manager v1.0.0" --notes-file RELEASE_NOTES.md --target "${{ github.sha }}"
          }
