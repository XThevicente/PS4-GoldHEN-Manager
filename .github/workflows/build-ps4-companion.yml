name: Build PS4 Companion PKG

on:
  push:
    branches:
      - feature/ps4-companion-v0.5
    paths:
      - 'companion/ps4_app/**'
      - '.github/workflows/build-ps4-companion.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify build dependencies
        run: |
          for tool in clang-14 ld.lld-14 curl tar; do
            command -v "$tool"
          done
          clang-14 --version
          ld.lld-14 --version

      - name: Download OpenOrbis v0.5.4
        run: |
          curl -fL -o openorbis.tar.gz https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          tar xzf openorbis.tar.gz
          echo "OO_PS4_TOOLCHAIN=$PWD/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"

      - name: Prepare package assets
        working-directory: companion/ps4_app
        run: bash ./prepare_openorbis_assets.sh

      - name: Build PKG
        working-directory: companion/ps4_app
        run: make CC=clang-14 LD=ld.lld-14

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: PS4_GoldHEN_Companion_v0.5.1_PKG
          path: companion/ps4_app/*.pkg

