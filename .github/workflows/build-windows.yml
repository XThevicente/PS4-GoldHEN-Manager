name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/scene-hub-integration, feature/multiconsole-transfer-queue, feature/resumable-ftp-ps5-adapter, feature/orbisnet-online-hub, feature/rpi-357-dashboard, feature/xcloud4-resources, feature/xbox-controller-142]
    paths:
      - 'ps4_manager.py'
      - 'scene_hub.py'
      - 'scene_queue.py'
      - 'console_profiles.py'
      - 'transfer_queue.py'
      - 'transfer_ui.py'
      - 'resumable_ftp.py'
      - 'ps5_adapter.py'
      - 'orbisnet_hub.py'
      - 'rpi_dashboard.py'
      - 'xcloud4_resources.py'
      - 'xbox_controller_resources.py'
      - 'scene_news.json'
      - 'tests/**'
      - 'requirements.txt'
      - 'assets/**'
      - 'build_windows.bat'
      - '.github/workflows/build-windows.yml'

# Important: this workflow builds an Actions artifact only.
# It must NEVER silently overwrite the stable v1.0.0 GitHub Release.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Validate sources
        run: |
          python -m py_compile ps4_manager.py scene_hub.py scene_queue.py console_profiles.py transfer_queue.py transfer_ui.py resumable_ftp.py ps5_adapter.py orbisnet_hub.py rpi_dashboard.py xcloud4_resources.py xbox_controller_resources.py
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Resolve version
        shell: pwsh
        run: |
          $v = python -c "import ps4_manager; print(ps4_manager.APP_VERSION)"
          if ($LASTEXITCODE -ne 0 -or !$v) { throw "Cannot determine APP_VERSION" }
          "MANAGER_VERSION=$v" >> $env:GITHUB_ENV

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "PS4_GoldHEN_Manager_v$env:MANAGER_VERSION" `
            --icon "assets/ps4_goldhen_manager.ico" `
            --add-data "assets/ps4_goldhen_manager.ico;assets" `
            ps4_manager.py

      - name: Upload beta EXE (no GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: PS4_GoldHEN_Manager_v${{ env.MANAGER_VERSION }}_Windows
          path: dist/PS4_GoldHEN_Manager_v${{ env.MANAGER_VERSION }}.exe
          if-no-files-found: error
          retention-days: 30
